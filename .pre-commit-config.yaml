# Локальные гейты. Ставится: pip install pre-commit && pre-commit install
#
# gitleaks добавлен 10.09.2026 после утечки токена бота: он лежал в публичном репозитории
# с января в закоммиченном .pyc (строковые литералы модуля видны в байт-коде как есть),
# при том что из .py его убрали ещё в марте. detect-private-key такое не ловит —
# он ищет только PEM-заголовки приватных ключей, а не токены Telegram/Bybit/Anthropic.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - "--max-line-length=120"
          - "--extend-ignore=E203,W503"
          - "--exclude=venv,archive"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # 500 КБ, а не 1000: в репозиторий уже уезжало 76 МБ venv-а. Порог должен
      # мешать заметить лишнее, а не пропускать «ну почти влезло».
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict
