# Заголовки безопасности market-bot (кладётся в /etc/nginx/snippets/).
#
# Вынесены в отдельный файл потому, что add_header внутри location ОТМЕНЯЕТ все
# add_header уровня server — классическая ловушка nginx. Каждый location со своим
# add_header (кэш статики, no-store для index.html) подключает этот файл заново.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# frame-ancestors — только веб-клиенты Telegram: Mini App открывается во фрейме у них.
# connect-src 'self' покрывает и wss того же хоста (CSP3).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org https://telegram.org" always;
