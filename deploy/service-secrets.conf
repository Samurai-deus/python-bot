# Какие секреты видит каждый сервис (аудит 29.09.2026, пакет 8: раньше каждый контейнер получал весь .env).
# Формат: <сервис compose>: <имена через пробел>.
#
# Секрет — имя, в котором есть KEY, SECRET, TOKEN, PASSWORD, PASSPHRASE или DSN, а также REDIS_URL (в нём пароль).
# deploy/split-env.sh собирает на сервере env/<сервис>.env из общего .env: все несекретные строки и только
# перечисленные здесь секреты. Новый секрет в коде без строки здесь ловит tests/test_service_secrets.py.
#
# Почему так:
#   bot       — ордера и баланс (ключи общего демо-счёта), ключи из базы (ENCRYPTION_KEY), ИИ-трейдер (OpenRouter)
#   api       — проверка initData (токен), лимиты и сессии (Redis), Sentry. Ключей биржи нет: смотрит в интернет
#   portfolio — И14 торгует на том же демо-счёте, что и бот
#   btcalts   — И18, свой субсчёт
#   carry     — И13, свой субсчёт
#   news      — разметка новостей (OpenRouter); владельцу не пишет — токена бота нет
# TELEGRAM_BOT_TOKEN — только у тех, кто пишет владельцу. recorder секретов не получает вовсе (без env_file).
bot: TELEGRAM_BOT_TOKEN BYBIT_API_KEY BYBIT_API_SECRET ENCRYPTION_KEY OPENROUTER_API_KEY
api: TELEGRAM_BOT_TOKEN REDIS_URL SENTRY_DSN
portfolio: TELEGRAM_BOT_TOKEN BYBIT_API_KEY BYBIT_API_SECRET
btcalts: TELEGRAM_BOT_TOKEN BTCALTS_BYBIT_API_KEY BTCALTS_BYBIT_API_SECRET
carry: TELEGRAM_BOT_TOKEN CARRY_BYBIT_API_KEY CARRY_BYBIT_API_SECRET
news: OPENROUTER_API_KEY
