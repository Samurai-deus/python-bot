# market-bot на проде. Кладётся на сервер шагом `deploy.sh release` как
# /opt/market-bot/docker-compose.yml; образ собирает тот же шаг, тег = git sha.
#
# Корневой docker-compose.yml остаётся для локальной разработки. Отличия этого:
#   • нет Prometheus/Grafana/Alertmanager. Хост делит память со стеком Supabase
#     (свободно ~3,2 ГБ), а мониторинг корневого файла был нерабочим:
#     alertmanager слал на несуществующий endpoint (аудит, находка C-8);
#   • нет PostgreSQL: на этапе бумажной торговли база — SQLite в именованном томе,
#     бэкап — deploy/backup.sh по таймеру;
#   • API на 127.0.0.1:8100 — порт 8000 на хосте занят;
#   • host.docker.internal указывает на хост — через него идёт трафик к Telegram
#     (sing-box на хосте), потому что напрямую api.telegram.org с хоста недоступен.
name: market-bot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    image: market-bot:${RELEASE_TAG:?RELEASE_TAG задаёт deploy.sh}
    container_name: market-bot
    restart: unless-stopped
    command: ["python", "runner.py"]
    env_file:
      - /opt/market-bot/.env
    environment:
      DB_PATH: /data/db/market_bot.db
      LOG_TO_FILE: "false"
      # И14 (решение владельца 14.09): демо-счёт отдан портфелю market-bot-portfolio — сигнальные
      # стратегии бота новых позиций не открывают, чужие позиции при старте не усыновляются.
      SIGNAL_TRADING_ENABLED: "false"
      ADOPT_EXCHANGE_POSITIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - market_data:/data
    networks:
      - egress
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging

  api:
    image: market-bot:${RELEASE_TAG:?RELEASE_TAG задаёт deploy.sh}
    container_name: market-bot-api
    restart: unless-stopped
    command: ["python", "run_api.py"]
    env_file:
      - /opt/market-bot/.env
    environment:
      DB_PATH: /data/db/market_bot.db
      API_HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - market_data:/data
    ports:
      - "127.0.0.1:8100:8000"
    networks:
      - egress
      - internal
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

  # Только счётчики лимита запросов API: без персистентности, наружу не видна.
  # В production недоступный Redis = 503 на все запросы API (лимит fail-closed).
  redis:
    image: redis:7.4-alpine
    container_name: market-bot-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD должен быть в /opt/market-bot/.env}
    command: ["sh", "-c", "exec redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 96m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # Исполнитель И14 (docs/TRADER_PLAN.md): портфель тренда И4 + моментума И3 на демо-счёте бота
  # (тот же ключ из .env), сигнальные стратегии бота выключены. База бота — ради условия старта
  # (журнал без открытых сделок); прокси хоста — для сообщений в Telegram. Свой том с базой и пульсом.
  portfolio:
    image: market-bot:${RELEASE_TAG:?RELEASE_TAG задаёт deploy.sh}
    container_name: market-bot-portfolio
    restart: unless-stopped
    command: ["python", "-m", "portfolio"]
    env_file:
      - /opt/market-bot/.env
    environment:
      DB_PATH: /data/db/market_bot.db
      PORTFOLIO_DIR: /portfolio
      PORTFOLIO_CAPITAL_USDT: "1000"
      # Поправка правила И14 от 14.09: догоняющая ребалансировка в неделю запуска (один раз).
      PORTFOLIO_START_THIS_WEEK: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - market_data:/data
      - portfolio_data:/portfolio
    networks:
      - egress
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "python", "-m", "portfolio.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging: *logging

  # Исполнитель И13 (docs/TRADER_PLAN.md): сбор фандинга на ОТДЕЛЬНОМ демо-субсчёте Bybit — свой
  # ключ CARRY_BYBIT_API_KEY/SECRET из .env (без него контейнер падает, ключ бота не берёт), свой том
  # с базой и пульсом. Bybit доступен с сервера напрямую — прокси не нужен. Выкладка бота от него не зависит.
  carry:
    image: market-bot:${RELEASE_TAG:?RELEASE_TAG задаёт deploy.sh}
    container_name: market-bot-carry
    restart: unless-stopped
    command: ["python", "-m", "carry"]
    env_file:
      - /opt/market-bot/.env
    environment:
      CARRY_DIR: /carry
    volumes:
      - carry_data:/carry
    networks:
      - egress
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 192m
    healthcheck:
      test: ["CMD", "python", "-m", "carry.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging: *logging

  # Сборщик новостей с оценкой ИИ (docs/TRADER_PLAN.md, И10). Нужны ключ OpenRouter и прокси
  # хоста (OpenRouter с IP сервера отвечает 403) — поэтому .env и host-gateway, как у бота.
  # Пишет в базу бота (news_items/news_scores, расход — в ai_usage с назначением news):
  # данные И10 попадают в тот же бэкап. Выкладка бота от сборщика не зависит.
  news:
    image: market-bot:${RELEASE_TAG:?RELEASE_TAG задаёт deploy.sh}
    container_name: market-bot-news
    restart: unless-stopped
    command: ["python", "-m", "news"]
    env_file:
      - /opt/market-bot/.env
    environment:
      DB_PATH: /data/db/market_bot.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - market_data:/data
    networks:
      - egress
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 192m
    healthcheck:
      test: ["CMD", "python", "-m", "news.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging: *logging

  # Запись стакана и сделок Bybit для будущих гипотез (docs/TRADER_PLAN.md, пункт 2).
  # Публичный WebSocket без ключей: .env не нужен и не передаётся. Свой том; предел
  # занятого места держит сама запись (RECORDER_CAP_GB). Выкладка бота от записи не
  # зависит: ожидание релиза смотрит бот, API и Redis, а запись — smoke и сторож.
  recorder:
    image: market-bot:${RELEASE_TAG:?RELEASE_TAG задаёт deploy.sh}
    container_name: market-bot-recorder
    restart: unless-stopped
    command: ["python", "-m", "recorder"]
    environment:
      RECORDER_DIR: /recorder
      RECORDER_CAP_GB: "20"
    volumes:
      - recorder_data:/recorder
    networks:
      - egress
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 192m
    healthcheck:
      test: ["CMD", "python", "-m", "recorder.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *logging

volumes:
  market_data:
  recorder_data:
  carry_data:
  portfolio_data:

networks:
  egress: {}
  internal:
    internal: true
