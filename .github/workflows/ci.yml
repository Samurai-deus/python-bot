name: CI

# Гейт перед влитием в main. До 10.09.2026 workflow existed, но не гейтил ничего:
# 16 из 16 последних запусков были красными (все — падение сбора тестов из-за
# отсутствия TELEGRAM_BOT_TOKEN в окружении раннера), а branch protection не было.
# Следствие: 16 PR Dependabot, среди них закрывающие 82 известные уязвимости,
# висели невлитыми с апреля — влить их было не во что, проверка всё равно красная.
#
# Что здесь проверяется теперь и почему именно это:
#   lint      — ruff (pyflakes целиком, bugbear, async, UP) и mypy на исполнителях (29.09.2026;
#               до этого — только фатальный класс flake8). F821 в core/system_guardian.py прожил в main месяцы.
#   tests     — весь tests/, без переменных окружения: модули обязаны импортироваться
#               в пустом окружении, это отдельный инвариант (см. job import-hygiene).
#   docker    — образ обязан собираться. Раньше сборки в CI не было вовсе, поэтому
#               PR Dependabot на python:3.14-slim выглядел бы зелёным, хотя для
#               psycopg2-binary==2.9.10 колёс под cp314 не существует.
#   frontend  — tsc и eslint для miniapp. Шесть npm-веток Dependabot не проверял никто.
#   secrets   — gitleaks по всей истории. Токен бота пролежал в репозитории
#               с января по сентябрь в закоммиченном .pyc.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Отменяем предыдущий прогон на той же ветке — экономия раннеров при частых пушах
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Линт (фатальный класс)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: ruff (pyflakes целиком, bugbear, async, современный синтаксис)
        # До 29.09.2026 проверялся только фатальный класс flake8; полный набор давал 3114 замечаний,
        # из них настоящая ошибка — пустой «Топ-3 символа» в отчёте статистики. Настройки — pyproject.toml.
        run: ruff check .
      - name: mypy (денежный путь исполнителей И13/И14/И18)
        run: mypy

  import-hygiene:
    name: Импорт без окружения
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Модули импортируются в пустом окружении и ничего не создают
        # Именно этот инвариант был нарушен и делал CI красным: telegram_bot.py
        # бросал ValueError на уровне модуля, а runner.py создавал файл лога.
        # `env -i` даёт по-настоящему пустое окружение, PATH возвращаем вручную.
        run: |
          env -i PATH="$PATH" HOME="$HOME" python -c "
          import runner, telegram_bot, config, database
          print('импорт без переменных окружения: ok')
          "
          test ! -f runner.log || (echo "ОШИБКА: импорт создал runner.log" && exit 1)

  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: pytest
        # Переменных окружения нет намеренно: тесты обязаны проходить без них.
        # Таймаут на тест — страховка от зависшего сторожевого потока: раньше
        # прогон обрывался через os._exit без единой строки о причине.
        # Один прогон с покрытием всего проекта (до 29.09 тесты гонялись дважды), дальше — пороги по группам.
        run: python -m pytest tests/ -q --timeout=120 --cov=. --cov-report=
      - name: Порог покрытия — ядро решений
        run: |
          coverage report --fail-under=80 \
            --include="core/decision_core.py,core/risk_core.py,core/position_sizer.py,brains/meta_decision_brain.py,trading_mode.py,utils/env.py"
      - name: Порог покрытия — исполнители И13/И14/И18 (храповик 29.09.2026, было 77 %)
        run: coverage report --fail-under=75 --include="portfolio/*,btcalts/*,carry/*"
      - name: Покрытие всего проекта (для глаз, без порога)
        run: coverage report | tail -3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: docker build
        # Без этого шага PR Dependabot на python:3.14-slim прошёл бы зелёным:
        # тесты ставят зависимости из requirements.txt на 3.12, а образ на 3.14
        # упал бы на psycopg2-binary, для которого нет колёс под cp314.
        run: docker build -t market-bot:ci .
      - name: Контейнер стартует и не падает на импорте
        run: |
          docker run --rm --entrypoint python market-bot:ci -c "
          import runner, telegram_bot
          print('импорт внутри образа: ok')
          "
      - name: Уязвимости образа (Trivy, критичные с готовым исправлением)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress market-bot:ci

  frontend:
    name: Mini App (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - name: Уязвимости зависимостей (рантайм мини-аппа)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deps-audit:
    name: Аудит зависимостей Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: pip-audit по замку (известные уязвимости, в том числе транзитивных пакетов)
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip --progress-spinner off

  secrets:
    name: Поиск секретов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Полная история: секрет может лежать в старом коммите, а не в диффе.
          # Токен бота именно так и жил — из .py его убрали в марте, а в .pyc
          # он оставался до сентября.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
