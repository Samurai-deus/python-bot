# Обновления зависимостей.
#
# Прежняя настройка открывала до 16 PR в неделю по одному на пакет и ни один
# из них не гейтился: CI был красным всегда, поэтому PR копились. На 10.09.2026
# висело 16 незакрытых, среди них обновления aiohttp и cryptography, закрывающие
# 82 известные уязвимости. Теперь минорные и патч-обновления группируются в один
# PR на экосистему, а мажорные приходят по одному — их надо смотреть глазами.
version: 2
updates:
  # PR по pip меняет requirements.txt, а образ ставится из замка requirements.lock: tests/test_lock.py
  # сделает такой PR красным, пока замок не пересобран (команда — в шапке requirements.lock).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "npm"
    directory: "/miniapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 — нативный порт на Go; typescript-eslint 8 объявляет поддержку
      # только typescript <6.1, и npm ci падает на peer-зависимостях (10.09.2026, PR #25).
      # Снять, когда typescript-eslint поддержит 7.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Минор/мажор Python автоматически не бампаем: переход — отдельная работа (замок requirements.lock
      # собирается под версию, CI и Dockerfile меняются вместе). 29.09.2026 — переход 3.12 → 3.14 (у
      # psycopg2-binary 2.9.13 появились колёса cp314). Обновления хэша 3.14-slim приходят как обычно.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
