# Rate limiting zones: per direct IP and per X-Forwarded-For header.
# Both applied together so proxied clients cannot bypass limits by spoofing headers.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $http_x_forwarded_for zone=api_limit_xff:10m rate=10r/s;

server {
    listen 80;
    server_name signabot.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name signabot.ru;

    ssl_certificate /etc/letsencrypt/live/signabot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signabot.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/miniapp;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=api_limit_xff burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Grafana dashboard (admin only via browser)
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Rewrite redirects from Grafana
        proxy_redirect http://127.0.0.1:3000/ /grafana/;
    }

    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org";
    gzip on;
    gzip_types text/css application/javascript application/json;
}
